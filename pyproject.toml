[project]
name = "nsk"
version = "0.1.0"
description = "Neural guidance policies for autonomous station-keeping around asteroids"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests that take minutes"]
